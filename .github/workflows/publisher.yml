name: Israel Russian Deal Publisher

on:
  workflow_dispatch:
    inputs:
      use_mock_data:
        description: "Use the mock product feed"
        required: true
        type: boolean
        default: true
  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: read

concurrency:
  group: israel-deal-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependency
        run: python -m pip install requests

      - name: Run publisher
        run: python main.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ vars.TELEGRAM_CHANNEL_ID }}
          AMAZON_ASSOCIATE_TAG: ${{ vars.AMAZON_ASSOCIATE_TAG }}
          DATABASE_PATH: data/state.db
          USE_MOCK_DATA: ${{ github.event_name == 'workflow_dispatch' && inputs.use_mock_data || 'false' }}
